services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persistir la base de conversaciones (SQLite) y el indice de ChromaDB
      # entre reinicios del contenedor en local.
      - ./agentkit.db:/app/agentkit.db
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped
